<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Produtos</title>

    <script src="https://code.iconify.design/iconify-icon/3.0.2/iconify-icon.min.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/handlebars@4.7.9/dist/handlebars.min.js"></script>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg bg-body-tertiary shadow-sm mb-4">
        <div class="container-fluid">
            <iconify-icon icon="lucide:shopping-bag" class="fs-2 me-2"></iconify-icon>
            <span class="navbar-brand fw-bold">Catálogo de Produtos</span>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <div class="d-flex ms-auto" role="search">
                    <input id="campoBusca" class="form-control me-2" type="search" placeholder="Buscar produto">
                </div>
            </div>
        </div>
    </nav>

    <main class="container-fluid px-4">
        <section class="mb-5">
            <div class="d-flex align-items-center mb-3">
                <iconify-icon icon="lucide:package" class="fs-3 me-2"></iconify-icon>
                <h4 class="m-0">Produtos da Usabilidade </h4>
            </div>
            <!-- Innserir produtos  -->
            <div class="row" id="ProductsList">
                
            </div>
        </section>

        <hr>

        <section class="mb-5">
            <div class="d-flex align-items-center mb-3">
                <iconify-icon icon="mdi:cards-heart" class="fs-3 me-2 text-warning"></iconify-icon>
                <h4 class="m-0">Favoritos da Usabilidade</h4>
            </div>
            <!-- Insetir favoritos -->
            <div class="row" id="FavoritesList">
                
            </div>
        </section>
    </main>

    
    <script src="./js/storage.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/app.js"></script>
</body>

</html>
